# Bank A — Kuala Lumpur. The originating bank in the demo flows.
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bank_a

minipay:
  bank:
    name: Bank A
    bic: MNPAMYKLXXX
    city: Kuala Lumpur
    role: Originating bank
    time-zone: Asia/Kuala_Lumpur
  # Our flat fee for an outgoing payment, per currency (charged per charge bearer, see ADR-003).
  payments:
    outward-fees:
      EUR: 20.00
      GBP: 15.00
      MYR: 5.00
  # Nostro reconciliation (M8, ADR-009): our accounts kept by other banks, and their number there (nostro
  # master data). Each servicer sends its camt.053 at end of day; we match it against our ledger.
  recon:
    nostros:
      - { account: 1101-EUR-MNPB, servicer: MNPBDEFFXXX, servicer-account: DE87500100600778812003 }
      - { account: 1102-GBP-MNPC, servicer: MNPCGB2LXXX, servicer-account: GB86MNPC40051288334410 }
    adjustment-accounts:
      EUR: 6110-EUR-BANKCHG
      GBP: 6111-GBP-BANKCHG
  seed:
    enabled: true
    # Nostro balances are not seeded directly: they are the contra side of the customer deposits
    # they back. Malaysia has no IBAN, so domestic customers have plain account numbers.
    accounts:
      # --- Settlement & nostro accounts (assets)
      - { number: 1001-MYR-RENTAS, type: NOSTRO, currency: MYR, owner: "RENTAS settlement account (central bank)", counterparty-bic: MNCBMYKLXXX }
      - { number: 1101-EUR-MNPB,   type: NOSTRO, currency: EUR, owner: "Nostro EUR @ Bank B", counterparty-bic: MNPBDEFFXXX }
      - { number: 1102-GBP-MNPC,   type: NOSTRO, currency: GBP, owner: "Nostro GBP @ Bank C", counterparty-bic: MNPCGB2LXXX }
      # --- Vostro accounts (liabilities: other banks' money held here)
      - { number: 2201-MYR-MNPB, type: VOSTRO, currency: MYR, owner: "Vostro - Bank B (MYR)", counterparty-bic: MNPBDEFFXXX, opening-balance: 18440000.00, funded-from: 1001-MYR-RENTAS }
      - { number: 2202-MYR-MNPC, type: VOSTRO, currency: MYR, owner: "Vostro - Bank C (MYR)", counterparty-bic: MNPCGB2LXXX, opening-balance: 6105300.00,  funded-from: 1001-MYR-RENTAS }
      # --- Customers (liabilities)
      - { number: "514087234412", type: CUSTOMER, currency: EUR, owner: "Selangor Precision Components Sdn Bhd", opening-balance: 1252580.18, funded-from: 1101-EUR-MNPB }
      - { number: "514087611203", type: CUSTOMER, currency: EUR, owner: "Penang Semicon Test Sdn Bhd",           opening-balance: 1640220.55, funded-from: 1101-EUR-MNPB }
      - { number: "514066120983", type: CUSTOMER, currency: EUR, owner: "Nur Aisyah binti Kamal",                opening-balance: 6812.44,    funded-from: 1101-EUR-MNPB }
      - { number: "514055218840", type: CUSTOMER, currency: GBP, owner: "Kuching Timber Exports Bhd",            opening-balance: 450102.40,  funded-from: 1102-GBP-MNPC }
      - { number: "514031907765", type: CUSTOMER, currency: GBP, owner: "Muar Furniture Works Sdn Bhd",          opening-balance: 92410.00,   funded-from: 1102-GBP-MNPC }
      - { number: "514078003341", type: CUSTOMER, currency: MYR, owner: "Klang Valley Robotics Sdn Bhd",         opening-balance: 2926860.00, funded-from: 1001-MYR-RENTAS }
      - { number: "514090215568", type: CUSTOMER, currency: MYR, owner: "Lee Mei Ling",                          opening-balance: 48215.62,   funded-from: 1001-MYR-RENTAS }
      # --- P&L
      - { number: 4020-FEE-EUR, type: FEE_INCOME, currency: EUR, owner: "Fee income - outward transfers EUR" }
      - { number: 4021-FEE-GBP, type: FEE_INCOME, currency: GBP, owner: "Fee income - outward transfers GBP" }
      # M8: what reconciliation books when the correspondent's statement shows a charge or difference we did not
      # (a debit-normal technical account: an expense).
      - { number: 6110-EUR-BANKCHG, type: SUSPENSE, currency: EUR, owner: "Bank charges and reconciliation differences EUR", allow-overdraft: true }
      - { number: 6111-GBP-BANKCHG, type: SUSPENSE, currency: GBP, owner: "Bank charges and reconciliation differences GBP", allow-overdraft: true }
    # Bank A's routing table (ADR-004). Destination = institution (BIC8 + "*") or "*" for any; the
    # lowest priority valid on the value date wins. Rules are never edited: a change is a new rule
    # and the old one is end-dated, as R-010 → R-003 and R-005 → R-006 show.
    routing-rules:
      - { id: R-001, destination: "MNPBDEFF*", currency: EUR, method: DIRECT, settlement-account: 1101-EUR-MNPB, priority: 10, from: "2024-01-01", release: v2024.01.1 }
      - { id: R-002, destination: "MNPCGB2L*", currency: GBP, method: DIRECT, settlement-account: 1102-GBP-MNPC, priority: 10, from: "2024-01-01", release: v2024.01.1 }
      - { id: R-003, destination: "MNPCGB2L*", currency: EUR, method: SERIAL, next-hop: MNPBDEFFXXX, settlement-account: 1101-EUR-MNPB, priority: 20, from: "2025-06-01", release: v2025.05.2 }
      - { id: R-004, destination: "MNPDBEBB*", currency: EUR, method: SERIAL, next-hop: MNPBDEFFXXX, settlement-account: 1101-EUR-MNPB, priority: 20, from: "2024-01-01", release: v2024.01.1 }
      - { id: R-005, destination: "MNPEFRPP*", currency: EUR, method: SERIAL, next-hop: MNPBDEFFXXX, settlement-account: 1101-EUR-MNPB, priority: 20, from: "2024-01-01", to: "2026-11-30", release: v2024.01.1 }
      - { id: R-006, destination: "MNPEFRPP*", currency: EUR, method: COVER,  next-hop: MNPBDEFFXXX, settlement-account: 1101-EUR-MNPB, priority: 20, from: "2026-12-01", release: v2026.11.3 }
      # MYR to banks that hold a vostro with us: credit the vostro, on our own books.
      - { id: R-007, destination: "MNPBDEFF*", currency: MYR, method: DIRECT, settlement-account: 2201-MYR-MNPB, priority: 10, from: "2024-01-01", release: v2024.01.1 }
      - { id: R-008, destination: "MNPCGB2L*", currency: MYR, method: DIRECT, settlement-account: 2202-MYR-MNPC, priority: 10, from: "2024-01-01", release: v2024.01.1 }
      # Any other MYR payment goes through RENTAS, settled on our central bank account.
      - { id: R-009, destination: "*",         currency: MYR, method: RTGS,   settlement-account: 1001-MYR-RENTAS, priority: 50, from: "2024-01-01", release: v2024.01.1 }
      # History: until May 2025 Bank C was paid in EUR on an EUR account we held with them (since closed).
      - { id: R-010, destination: "MNPCGB2L*", currency: EUR, method: DIRECT, settlement-account: 1103-EUR-MNPC, priority: 20, from: "2024-01-01", to: "2025-05-31", release: v2024.01.1 }
      # Catch-alls: anyone else, through our correspondent for the currency.
      - { id: R-011, destination: "*",         currency: EUR, method: SERIAL, next-hop: MNPBDEFFXXX, settlement-account: 1101-EUR-MNPB, priority: 99, from: "2024-01-01", release: v2024.01.1 }
      - { id: R-012, destination: "*",         currency: GBP, method: SERIAL, next-hop: MNPCGB2LXXX, settlement-account: 1102-GBP-MNPC, priority: 99, from: "2024-01-01", release: v2024.01.1 }
      # Bank C's Manchester branch in EUR: by cover. The pacs.008 goes straight to Bank C, the money
      # separately through Bank B (pacs.009 COV), which credits Bank C's EUR account. Compare R-003:
      # Bank C's head office in EUR goes serially, the pacs.008 itself travelling through Bank B.
      - { id: R-020, destination: "MNPCGB2L200", currency: EUR, method: COVER, next-hop: MNPBDEFFXXX, settlement-account: 1101-EUR-MNPB, priority: 10, from: "2024-01-01", release: v2024.01.1 }
