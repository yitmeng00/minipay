# Shared settings for every bank instance. Bank-specific settings live in application-bank-{a,b,c}.yml.
spring:
  application:
    name: minipay-bank
  # Each module runs its own Flyway on its own schema (see LedgerConfiguration).
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # A bank that starts late (or for the first time) processes everything waiting in its inbox.
      auto-offset-reset: earliest
      properties:
        # The tracker subscribes by pattern; notice new network topics within seconds, not minutes.
        metadata.max.age.ms: 10000
    producer:
      # Wait for all in-sync replicas, and let the broker drop duplicate retries (idempotent producer).
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  datasource:
    username: minipay
    password: minipay
    hikari:
      maximum-pool-size: 20

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

minipay:
  bank:
    time-zone: UTC
  # The simulated banks: each has an inbox on the network. Messages to anyone else go to
  # minipay.network.external (nobody answers them; the console can play that bank).
  # Comma-separated (read with @Value; a YAML list would not bind to it).
  network:
    participants: MNPAMYKLXXX,MNPBDEFFXXX,MNPCGB2LXXX
  # Sanctions screening (ADR-007): a score at or above hold-threshold holds the payment for review;
  # releasing a case whose best score reaches four-eyes-threshold needs a second person.
  # lists: the list codes this bank screens against (empty = all loaded lists).
  compliance:
    hold-threshold: 75
    four-eyes-threshold: 90
    sla: PT2H
    lists: []
  seed:
    enabled: false
  payments:
    recovery-stale-after: PT30S
