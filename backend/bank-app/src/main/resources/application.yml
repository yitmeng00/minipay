# Shared settings for every bank instance. Bank-specific settings live in application-bank-{a,b,c}.yml.
spring:
  application:
    name: minipay-bank
  # Each module runs its own Flyway on its own schema (see LedgerConfiguration).
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Wait for all in-sync replicas, and let the broker drop duplicate retries (idempotent producer).
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  datasource:
    username: minipay
    password: minipay
    hikari:
      maximum-pool-size: 20

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

minipay:
  bank:
    time-zone: UTC
  seed:
    enabled: false
  payments:
    recovery-stale-after: PT30S
