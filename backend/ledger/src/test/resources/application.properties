spring.flyway.enabled=false
spring.mvc.problemdetails.enabled=true
# Bank A's time zone: business dates and statements are cut at local midnight.
minipay.bank.time-zone=Asia/Kuala_Lumpur
# Enough connections for the concurrency tests to actually contend on row locks.
spring.datasource.hikari.maximum-pool-size=32
logging.level.org.testcontainers=WARN
