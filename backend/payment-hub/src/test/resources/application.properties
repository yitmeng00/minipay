spring.flyway.enabled=false
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=32

minipay.bank.bic=MNPAMYKLXXX
minipay.bank.time-zone=Asia/Kuala_Lumpur
minipay.payments.outward-fees.EUR=20.00
minipay.payments.outward-fees.GBP=15.00
# Tests drive recovery and the relay by hand.
minipay.payments.recovery.enabled=false
minipay.outbox.relay.interval=PT1H
minipay.outbox.relay.send-timeout=PT3S

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=1500
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.linger.ms=0
logging.level.org.testcontainers=WARN
logging.level.org.apache.kafka=WARN
