spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.mvc.problemdetails.enabled=true
spring.datasource.hikari.maximum-pool-size=20
minipay.bank.bic=MNCBDEFFXXX
minipay.bank.time-zone=Europe/Berlin
minipay.settlement.operator=true
# The tests drive the clocks themselves (instantTimers, closeDueCycles, endOfDay).
minipay.settlement.timers=false
minipay.settlement.simulated-answer-delay=PT0S
logging.level.org.testcontainers=WARN
