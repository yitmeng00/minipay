# Local infrastructure for MiniPay.
#
# One PostgreSQL per bank: in the real world each bank runs its own core systems and
# never shares a database with another bank. Keeping three databases makes that
# boundary physical — Bank A cannot "cheat" by reading Bank B's tables.
#
# Kafka runs in KRaft mode (no ZooKeeper). It is used from M2 onwards
# (outbox relay, network simulator); in M0/M1 it is idle.

x-postgres: &postgres
  image: postgres:16-alpine
  environment: &pgenv
    POSTGRES_USER: minipay
    POSTGRES_PASSWORD: minipay
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U minipay"]
    interval: 5s
    timeout: 3s
    retries: 20
  # UTC everywhere: rule 10 — timestamps are stored as TIMESTAMPTZ in UTC.
  command: ["postgres", "-c", "timezone=UTC", "-c", "max_connections=200"]

services:
  bank-a-db:
    <<: *postgres
    container_name: minipay-bank-a-db
    environment:
      <<: *pgenv
      POSTGRES_DB: bank_a
    ports: ["5433:5432"]
    volumes: [bank-a-data:/var/lib/postgresql/data]

  bank-b-db:
    <<: *postgres
    container_name: minipay-bank-b-db
    environment:
      <<: *pgenv
      POSTGRES_DB: bank_b
    ports: ["5434:5432"]
    volumes: [bank-b-data:/var/lib/postgresql/data]

  bank-c-db:
    <<: *postgres
    container_name: minipay-bank-c-db
    environment:
      <<: *pgenv
      POSTGRES_DB: bank_c
    ports: ["5435:5432"]
    volumes: [bank-c-data:/var/lib/postgresql/data]

  kafka:
    image: apache/kafka:4.0.0
    container_name: minipay-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

volumes:
  bank-a-data:
  bank-b-data:
  bank-c-data:
